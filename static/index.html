<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>抖音下载器</title>
<style>
  :root {
    --bg: #0f1117;
    --card: #1a1d27;
    --border: #2a2d3a;
    --text: #e1e4ed;
    --muted: #8b8fa3;
    --accent: #fe2c55;
    --accent-hover: #ff4d6a;
    --success: #22c55e;
    --warning: #f59e0b;
    --error: #ef4444;
    --radius: 12px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 20px;
  }

  .container {
    width: 100%;
    max-width: 720px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  /* header */
  .header {
    text-align: center;
    padding: 32px 0 8px;
  }
  .header h1 {
    font-size: 28px;
    font-weight: 700;
    background: linear-gradient(135deg, #fe2c55, #ff6b81);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .header p {
    color: var(--muted);
    margin-top: 6px;
    font-size: 14px;
  }

  /* card */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
  }
  .card-title {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 16px;
  }

  /* input */
  .input-group {
    display: flex;
    gap: 10px;
  }
  .input-group input, .input-group textarea {
    flex: 1;
    min-width: 0;
    padding: 12px 16px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 14px;
    outline: none;
    transition: border-color .2s;
  }
  .input-group input:focus, .input-group textarea:focus {
    border-color: var(--accent);
  }
  .input-group input::placeholder, .input-group textarea::placeholder {
    color: var(--muted);
  }
  .download-input { align-items: flex-start; }
  .download-input textarea { font-family: inherit; resize: vertical; min-height: 110px; }

  /* buttons */
  .btn {
    padding: 12px 24px;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all .2s;
  }
  .btn-primary {
    background: var(--accent);
    color: #fff;
  }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-primary:disabled {
    opacity: .5;
    cursor: not-allowed;
  }
  .btn-sm {
    padding: 6px 14px;
    font-size: 13px;
    background: var(--border);
    color: var(--text);
    border-radius: 6px;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .btn-sm:hover { background: #3a3d4a; }

  .save-location { margin-top: 20px; }
  .save-location > label { display: block; margin-bottom: 8px; font-size: 14px; }
  .location-hint { color: var(--muted); font-size: 12px; margin-top: 8px; }
  .location-error { color: var(--error); }
  .btn-secondary { background: var(--border); color: var(--text); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  dialog {
    margin: auto;
    width: min(600px, calc(100% - 32px));
    max-height: 85vh;
    overflow: auto;
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
  }
  dialog::backdrop { background: #0009; }
  .folder-toolbar, .dialog-actions { display: flex; gap: 10px; margin-top: 14px; }
  .dialog-actions { justify-content: flex-end; }
  .folder-list { margin-top: 14px; height: 240px; overflow-y: auto; }
  .folder-item {
    display: block;
    width: 100%;
    border: 0;
    border-bottom: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    padding: 12px;
    text-align: left;
    overflow-wrap: anywhere;
    cursor: pointer;
  }
  .folder-item:hover { background: var(--border); }
  @media (max-width: 520px) {
    .input-group { flex-wrap: wrap; }
    .input-group input, .input-group textarea { flex-basis: 100%; }
    .btn { padding: 12px 16px; }
  }

  /* checkboxes */
  .options {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    margin-top: 14px;
  }
  .options label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 14px;
    color: var(--muted);
    cursor: pointer;
  }
  .options input[type="checkbox"] {
    accent-color: var(--accent);
    width: 16px; height: 16px;
  }

  /* task list */
  .task {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 0;
    border-bottom: 1px solid var(--border);
    gap: 12px;
  }
  .task:last-child { border-bottom: none; }

  .task-info { flex: 1; min-width: 0; }
  .task-url {
    font-size: 13px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .task-progress {
    font-size: 13px;
    margin-top: 3px;
  }

  /* status badges */
  .badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
  }
  .badge-queued { background: #334155; color: #94a3b8; }
  .badge-fetching { background: #1e3a5f; color: #60a5fa; }
  .badge-downloading { background: #5c3d0e; color: #fbbf24; }
  .badge-done { background: #14532d; color: #4ade80; }
  .badge-error { background: #450a0a; color: #f87171; }

  .task-actions { display: flex; gap: 6px; flex-wrap: wrap; }

  .empty {
    text-align: center;
    color: var(--muted);
    padding: 40px 0;
    font-size: 14px;
  }

  /* spinner */
  @keyframes spin { to { transform: rotate(360deg); } }
  .spinner {
    width: 16px; height: 16px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .6s linear infinite;
    display: inline-block;
    vertical-align: middle;
    margin-right: 6px;
  }

  .footer {
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    padding: 10px 0 30px;
  }
</style>
</head>
<body>

<div class="container">

  <!-- header -->
  <div class="header">
    <h1>🎵 抖音下载器</h1>
    <p>粘贴视频链接，无水印下载视频、音频、封面</p>
  </div>

  <!-- input card -->
  <div class="card">
    <div class="card-title">📥 新建下载</div>
    <div class="input-group download-input">
      <textarea id="urlInput" rows="4" aria-label="抖音视频链接，每行一个"
                placeholder="粘贴抖音视频链接，每行一个，支持批量下载"
                aria-describedby="batchHint" autocomplete="off" spellcheck="false"></textarea>
      <button class="btn btn-primary" id="submitBtn" onclick="submitDownload()">开始下载</button>
    </div>
    <p class="location-hint" id="batchHint">每行一个链接，按顺序下载，失败后自动继续下一条。Ctrl / ⌘ + Enter 提交。</p>
    <div class="options">
      <label><input type="checkbox" id="optVideo" /> 视频</label>
      <label><input type="checkbox" id="optAudio" checked /> 音频</label>
      <label><input type="checkbox" id="optCover" /> 封面</label>
      <label><input type="checkbox" id="optJson" /> API 数据 (JSON)</label>
    </div>
    <div class="save-location">
      <label for="saveLocation">保存位置</label>
      <div class="input-group">
        <input id="saveLocation" type="text" readonly placeholder="正在读取保存位置…" />
        <button class="btn btn-secondary" id="chooseLocationBtn" onclick="openFolderPicker()">选择文件夹</button>
      </div>
      <p class="location-hint" id="locationStatus" role="status">保存后，下次打开会继续使用此位置。</p>
    </div>
  </div>

  <!-- task list -->
  <div class="card">
    <div class="card-title">📋 下载任务</div>
    <div id="taskList">
      <div class="empty">还没有下载任务，在上方粘贴链接开始</div>
    </div>
  </div>

  <div class="footer">支持 /video/ID 和 /jingxuan?modal_id=ID 格式</div>

</div>

<dialog id="folderPicker" aria-labelledby="folderPickerTitle">
  <h2 class="card-title" id="folderPickerTitle">选择保存位置</h2>
  <form id="folderPathForm">
    <label for="folderPath">文件夹路径</label>
    <div class="input-group" style="margin-top:8px">
      <input id="folderPath" type="text" autocomplete="off" spellcheck="false"
             placeholder="例如 ~/Downloads/DyFetch" aria-describedby="folderHint" />
      <button class="btn btn-secondary" type="submit">前往</button>
    </div>
  </form>
  <div class="folder-toolbar">
    <button class="btn btn-sm" id="parentFolderBtn" onclick="browseFolders(parentFolder)">上一级</button>
    <button class="btn btn-sm" id="homeFolderBtn" onclick="browseFolders(homeFolder)">个人文件夹</button>
  </div>
  <div class="folder-list" id="folderList" aria-label="子文件夹"></div>
  <p class="location-hint" id="folderHint">可输入新路径，保存时会自动创建文件夹。位置位于运行服务的本机。</p>
  <p class="location-hint location-error" id="folderError" role="alert"></p>
  <div class="dialog-actions">
    <button class="btn btn-secondary" id="cancelLocationBtn" onclick="document.getElementById('folderPicker').close()">取消</button>
    <button class="btn btn-primary" id="saveLocationBtn" onclick="saveLocation()">保存位置</button>
  </div>
</dialog>

<!-- 隐藏的文件上传 form -->
<form id="downloadForm" style="display:none">
  <input type="hidden" name="task_id" />
  <input type="hidden" name="filename" />
</form>

<script>
  const tasks = {};
  let pollTimer = null;
  let parentFolder = '';
  let homeFolder = '';
  let currentFolder = '';
  let folderRequest = 0;
  let savingLocation = false;

  async function fetchJson(url, options) {
    const res = await fetch(url, options);
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || '请求失败');
    return data;
  }

  async function loadSettings() {
    const status = document.getElementById('locationStatus');
    try {
      const data = await fetchJson('/api/settings');
      document.getElementById('saveLocation').value = data.downloads_dir;
      status.textContent = '保存后，下次打开会继续使用此位置。';
      status.classList.remove('location-error');
    } catch (e) {
      status.textContent = '读取保存位置失败：' + e.message;
      status.classList.add('location-error');
    }
  }

  async function openFolderPicker() {
    document.getElementById('folderPicker').showModal();
    await browseFolders();
  }

  async function browseFolders(path) {
    if (savingLocation) return;
    const request = ++folderRequest;
    const list = document.getElementById('folderList');
    const error = document.getElementById('folderError');
    const saveBtn = document.getElementById('saveLocationBtn');
    const pathInput = document.getElementById('folderPath');
    const parentBtn = document.getElementById('parentFolderBtn');
    const homeBtn = document.getElementById('homeFolderBtn');
    error.textContent = '';
    list.textContent = '正在读取文件夹…';
    saveBtn.disabled = true;
    pathInput.disabled = parentBtn.disabled = homeBtn.disabled = true;
    try {
      const url = path === undefined ? '/api/directories' : '/api/directories?path=' + encodeURIComponent(path);
      const data = await fetchJson(url);
      if (request !== folderRequest) return;
      pathInput.value = data.path;
      currentFolder = data.path;
      parentFolder = data.parent;
      homeFolder = data.home;
      list.replaceChildren();
      for (const name of data.directories) {
        const button = document.createElement('button');
        button.className = 'folder-item';
        button.textContent = '📁 ' + name;
        button.addEventListener('click', () => browseFolders(data.path.replace(/\/$/, '') + '/' + name));
        list.appendChild(button);
      }
      if (!data.directories.length) list.textContent = '此文件夹没有子文件夹，可直接保存到这里。';
    } catch (e) {
      if (request !== folderRequest) return;
      list.replaceChildren();
      error.textContent = e.message;
    } finally {
      if (request === folderRequest) {
        saveBtn.disabled = pathInput.disabled = false;
        parentBtn.disabled = !parentFolder || currentFolder === parentFolder;
        homeBtn.disabled = !homeFolder;
      }
    }
  }

  async function saveLocation() {
    if (savingLocation) return;
    const error = document.getElementById('folderError');
    const path = document.getElementById('folderPath').value.trim();
    if (!path) { error.textContent = '请输入保存路径'; return; }
    const saveBtn = document.getElementById('saveLocationBtn');
    const cancelBtn = document.getElementById('cancelLocationBtn');
    savingLocation = true;
    saveBtn.disabled = cancelBtn.disabled = true;
    saveBtn.textContent = '保存中…';
    error.textContent = '';
    try {
      const data = await fetchJson('/api/settings', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ downloads_dir: path }),
      });
      document.getElementById('saveLocation').value = data.downloads_dir;
      const status = document.getElementById('locationStatus');
      status.textContent = '位置已保存，新任务将使用此目录。';
      status.classList.remove('location-error');
      document.getElementById('folderPicker').close();
    } catch (e) {
      error.textContent = e.message;
    } finally {
      savingLocation = false;
      saveBtn.disabled = cancelBtn.disabled = false;
      saveBtn.textContent = '保存位置';
    }
  }

  document.getElementById('folderPathForm').addEventListener('submit', e => {
    e.preventDefault();
    if (!savingLocation) browseFolders(document.getElementById('folderPath').value.trim());
  });
  document.getElementById('folderPicker').addEventListener('cancel', e => {
    if (savingLocation) e.preventDefault();
  });

  function statusBadge(s) {
    const map = {
      queued: 'badge-queued', fetching: 'badge-fetching',
      downloading: 'badge-downloading', done: 'badge-done', error: 'badge-error'
    };
    const names = {
      queued: '排队中', fetching: '获取中', downloading: '下载中',
      done: '已完成', error: '失败'
    };
    return `<span class="badge ${map[s] || 'badge-queued'}">${names[s] || s}</span>`;
  }

  function renderTasks() {
    const el = document.getElementById('taskList');
    const items = Object.values(tasks).sort((a, b) => b._ts - a._ts);
    if (!items.length) {
      el.innerHTML = '<div class="empty">还没有下载任务，在上方粘贴链接开始</div>';
      return;
    }
    el.innerHTML = items.map(t => {
      let actions = '';
      if (t.status === 'done' && t.files) {
        for (const [label, f] of Object.entries(t.files)) {
          if (f.path) {
            const filename = f.path.split('/').pop();
            actions += `<a class="btn-sm" href="/api/file/${t.id}/${filename}" download>⬇ ${label}</a>`;
          }
        }
      }
      let progressHtml = escHtml(t.progress || '');
      if (t.status === 'fetching') {
        progressHtml = `<span class="spinner"></span>${progressHtml}`;
      }
      return `<div class="task">
        <div class="task-info">
          <div class="task-url">${escHtml(t.url)}</div>
          <div class="task-progress">${progressHtml}</div>
        </div>
        ${statusBadge(t.status)}
        <div class="task-actions">${actions}</div>
      </div>`;
    }).join('');
  }

  function escHtml(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  async function submitDownload() {
    const input = document.getElementById('urlInput');
    const urls = input.value.split(/\r?\n/).map(url => url.trim()).filter(Boolean);
    if (!urls.length) return alert('请输入抖音视频链接，每行一个');

    const btn = document.getElementById('submitBtn');
    if (btn.disabled) return;
    btn.disabled = true;
    btn.textContent = '提交中...';

    try {
      const data = await fetchJson('/api/download/batch', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          urls: urls,
          video: document.getElementById('optVideo').checked,
          audio: document.getElementById('optAudio').checked,
          cover: document.getElementById('optCover').checked,
          save_json: document.getElementById('optJson').checked,
        })
      });
      const timestamp = Date.now();
      data.forEach((task, index) => {
        tasks[task.id] = { ...task, _ts: timestamp - index / data.length };
      });
      input.value = '';
      renderTasks();
      startPolling();
    } catch (e) {
      alert('请求失败: ' + e.message);
    } finally {
      btn.disabled = false;
      btn.textContent = '开始下载';
    }
  }

  async function pollTasks() {
    const active = Object.values(tasks).filter(t => t.status !== 'done' && t.status !== 'error');
    if (!active.length) { stopPolling(); return; }

    for (const t of active) {
      try {
        const data = await fetchJson(`/api/task/${t.id}`);
        tasks[t.id] = { ...data, _ts: tasks[t.id]?._ts || Date.now() };
      } catch(e) { /* ignore */ }
    }
    renderTasks();

    // check again
    const stillActive = Object.values(tasks).filter(t => t.status !== 'done' && t.status !== 'error');
    if (!stillActive.length) stopPolling();
  }

  function startPolling() {
    if (!pollTimer) pollTimer = setInterval(pollTasks, 1500);
  }
  function stopPolling() {
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  }

  // Enter inserts a new line; Ctrl/Cmd + Enter submits the batch.
  document.getElementById('urlInput').addEventListener('keydown', e => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
      e.preventDefault();
      submitDownload();
    }
  });

  // focus on load
  document.getElementById('urlInput').focus();
  loadSettings();
  renderTasks();
</script>
</body>
</html>
